<div id="statusbar">

  <!-- Status indicator -->
  <div class="status-item">
    <div class="status-dot" style="background:var(--ostp-primary)"></div>
    <span class="status-ok" id="stMsg">READY</span>
  </div>

  <!-- Brand -->
  <span>OSTP · @echoShift · Zapopan, Jalisco</span>

  <!-- Clock -->
  <span class="status-right" id="stTime"></span>

</div>
